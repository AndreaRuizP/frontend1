<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/src/assets/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' cdn.jsdelivr.net;
    style-src 'self' 'unsafe-inline'
      cdn-uicons.flaticon.com
      cdn.jsdelivr.net
      fonts.googleapis.com
      cdnjs.cloudflare.com;
    font-src 'self'
      fonts.gstatic.com
      cdn.jsdelivr.net
      cdnjs.cloudflare.com
      cdn-uicons.flaticon.com
      data:;
    img-src 'self' data: blob: https:;
    connect-src 'self' ws: wss: http://localhost:3000 https://residuos-2mr5.onrender.com https://res.cloudinary.com https://vision.googleapis.com;
    object-src 'none';
    base-uri 'self';
  ">

  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- Tema oscuro: aplicar antes de renderizar para evitar flash -->
  <script>
    (function () {
      try {
        const dark = JSON.parse(localStorage.getItem("darkMode") ??
          JSON.stringify(window.matchMedia("(prefers-color-scheme: dark)").matches));
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://cdn-uicons.flaticon.com">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-solid-rounded/css/uicons-solid-rounded.css">

  <title>CleanPoints</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
